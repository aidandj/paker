# On every push to main: bump the semver tag, build the Docker image (multi-arch -> GHCR),
# the Android APK and an unsigned iOS .ipa, then publish a GitHub release with the files attached.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semver.outputs.version_tag }}
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Next version from git history: patch bump since the last v* tag, "(MINOR)" or "(MAJOR)" in a
      # commit message bumps more. The tag itself is created by the release job after the builds succeed.
      - id: semver
        uses: PaulHatch/semantic-version@v6.0.2
        with:
          tag_prefix: v
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"
          enable_prerelease_mode: true

  docker:
    needs: [version, ios]   # the image also serves the .ipa and the SideStore source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: paker-${{ needs.version.outputs.version }}-ipa
          path: ipa
      - run: node scripts/altstore-source.js ipa/*.ipa "${{ needs.version.outputs.version }}" web-extra
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=${{ needs.version.outputs.version }}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"   # no *.dockerbuild artifacts
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest already has the Android SDK at $ANDROID_HOME; Gradle fetches what it needs.
      - run: npm ci
      - name: Stamp version into app.json
        run: |
          jq --arg v "${{ needs.version.outputs.version }}" --argjson b ${{ github.run_number }} \
            '.expo.version = $v | .expo.android.versionCode = $b | .expo.ios.buildNumber = ($b | tostring)' \
            app.json > app.json.tmp && mv app.json.tmp app.json
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk paker-${{ needs.version.outputs.version }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: paker-${{ needs.version.outputs.version }}-apk
          path: paker-*.apk

  ios:
    needs: version
    runs-on: macos-26   # Xcode 26, which Expo SDK 58 needs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stamp version into app.json
        run: |
          jq --arg v "${{ needs.version.outputs.version }}" --argjson b ${{ github.run_number }} \
            '.expo.version = $v | .expo.android.versionCode = $b | .expo.ios.buildNumber = ($b | tostring)' \
            app.json > app.json.tmp && mv app.json.tmp app.json
      - run: npx expo prebuild --platform ios
        env:
          CI: 1
      # Unsigned build: no Apple certificates in CI. AltStore/SideStore/Sideloadly sign it on install.
      - name: Build (unsigned)
        run: |
          xcodebuild -workspace ios/paker.xcworkspace -scheme paker -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > xcodebuild.log 2>&1 \
            || { grep -E "error:|BUILD FAILED" xcodebuild.log | head -40; tail -40 xcodebuild.log; exit 1; }
      - name: Package .ipa
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/paker.app Payload/
          zip -qr paker-${{ needs.version.outputs.version }}-unsigned.ipa Payload
          ls -la paker-*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: paker-${{ needs.version.outputs.version }}-ipa
          path: paker-*.ipa

  release:
    needs: [version, docker, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: paker-*
          path: dist
          merge-multiple: true
      # Creates the tag (it does not exist yet) and the release, with auto-generated notes.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          body: |
            Docker image: `${{ env.IMAGE }}:${{ needs.version.outputs.tag }}` (also `:latest`)
            The APK is signed with the debug key (fine for sideloading). The .ipa is unsigned.
          files: |
            dist/*.apk
            dist/*.ipa
