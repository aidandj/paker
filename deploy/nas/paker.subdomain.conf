## Paker - https://paker.aidandj.com
## SWAG proxy conf, same pattern as camux: SWAG listens on 3001 (router forwards 443 -> NAS:3001),
## wildcard cert for *.aidandj.com, upstream is the paker container's host port on the docker bridge.

server {
    listen 3001 ssl http2;
    listen [::]:3001 ssl http2;

    server_name paker.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        # Never spool to disk: SWAG's /var/lib/nginx/tmp has broken permissions, which turns large
        # sync bodies into 500s and the ~600 KB web bundle into truncated (HTTP/2 protocol error)
        # responses. Streaming both ways also suits the SSE stream.
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_buffer_size 2m;
        set $upstream_app 172.17.0.1;
        set $upstream_port 8090;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
