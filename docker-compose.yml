version: "3.8"   # kept for the docker-compose v1 on the NAS; v2 ignores it

services:
  paker:
    image: ghcr.io/aidandj/paker:latest   # docker compose pull; or build locally with --build
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:                       # only these reach the container; PORT below is the host port
      SYNC_USER: ${SYNC_USER}
      SYNC_PASSWORD: ${SYNC_PASSWORD}
    ports:
      - "${PORT:-8080}:8080"   # web app at /, JSON API at /api/
      # - "9090:9090"          # gRPC, uncomment if you want it reachable
    volumes:
      - paker-data:/data

volumes:
  paker-data:
