syntax = "proto3";

package paker.v1;

import "google/api/annotations.proto";

option go_package = "paker/server/gen/paker/v1;pakerv1";

// Status of one item on the packing list.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_NOT_PACKED = 1;
  STATUS_PLANNED = 2;
  STATUS_PACKED = 3;
  STATUS_NEEDS_REFILL = 4;
}

message Item {
  string id = 1;
  string name = 2;
  Status status = 3;
  // Unix milliseconds of the last change to this item. Newer wins on merge.
  int64 updated_at = 4;
  // Tombstone: deleted items stay in the list so the delete reaches every device.
  bool deleted = 5;
  // Present only for counted items.
  Quantity quantity = 6;
  // Goes to "planned" instead of "not packed" when a new trip starts (also true for every item of
  // an always-pack category).
  bool always_pack = 7;
}

// Counts for an item that is packed in multiples.
message Quantity {
  // How many to bring. 0 means the item is not on this trip.
  int32 needed = 1;
  // How many are in the bag.
  int32 packed = 2;
}

message Category {
  string id = 1;
  string name = 2;
  // Items here go to "planned" instead of "not packed" when a new trip starts.
  bool always_pack = 3;
  int64 updated_at = 4;
  bool deleted = 5;
  repeated Item items = 6;
}

// The whole packing list. Per-device view state (mode, collapsed) is not part of it.
message PackingList {
  repeated Category categories = 1;
}

message GetListRequest {}

message GetListVersionRequest {}

message GetListVersionResponse {
  // Changes whenever the stored list changes. Clients poll this and sync only when it differs.
  string version = 1;
}

message GetListResponse {
  PackingList list = 1;
}

message WatchListRequest {}

message WatchListResponse {
  // The current list version; sent on connect, whenever the list changes, and as a heartbeat.
  string version = 1;
}

message SyncListRequest {
  // The device's full list.
  PackingList list = 1;
}

message SyncListResponse {
  // The stored list after merging in the request. The device should replace its copy with this.
  PackingList list = 1;
  // Version of that list, for comparison with GetListVersion.
  string version = 2;
}

service PakerService {
  // Returns the stored list without changing it.
  rpc GetList(GetListRequest) returns (GetListResponse) {
    option (google.api.http) = {get: "/api/v1/list"};
  }
  // Cheap poll: the current list version, so a client can tell whether a sync is needed.
  rpc GetListVersion(GetListVersionRequest) returns (GetListVersionResponse) {
    option (google.api.http) = {get: "/api/v1/list:version"};
  }
  // Server stream of list versions: an event on connect, one per change, plus a heartbeat every
  // 25s. Served as Server-Sent Events when the client sends "Accept: text/event-stream".
  rpc WatchList(WatchListRequest) returns (stream WatchListResponse) {
    option (google.api.http) = {get: "/api/v1/list:watch"};
  }
  // Merges the device's list into the stored one (newest change per item wins) and returns the result.
  rpc SyncList(SyncListRequest) returns (SyncListResponse) {
    option (google.api.http) = {
      post: "/api/v1/list:sync"
      body: "*"
    };
  }
}
